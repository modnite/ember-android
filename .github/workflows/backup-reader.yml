name: Ember Backup Reader
# Builds the desktop reader for Windows, macOS and Linux and attaches the packages to a release when a tag v* is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Attach the packages to this existing release tag (for example v1.0.0)
        required: false
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/backup-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Test
        shell: bash
        run: chmod +x gradlew && ./gradlew test --no-daemon
      - name: Package
        shell: bash
        run: ./gradlew createDistributable --no-daemon
      - name: Zip
        shell: bash
        run: |
          cd build/compose/binaries/main
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "../../../../Ember-Backup-Reader-${{ runner.os }}.zip" app/*; else (cd app && zip -qr "../../../../../Ember-Backup-Reader-${{ runner.os }}.zip" .); fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-Backup-Reader-${{ runner.os }}
          path: tools/backup-reader/Ember-Backup-Reader-${{ runner.os }}.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "${{ inputs.tag || github.ref_name }}" "Ember-Backup-Reader-${{ runner.os }}.zip" --clobber
